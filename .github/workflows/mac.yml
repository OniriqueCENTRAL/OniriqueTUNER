# Compile ONIRIQUE TUNER pour Mac : VST3 et Audio Unit (Logic Pro, GarageBand), Intel et Apple Silicon.
# À lancer depuis l'onglet « Actions » du dépôt GitHub, bouton « Run workflow ».
# Le résultat se télécharge en bas de la page de l'exécution, rubrique « Artifacts » : il contient
# « ONIRIQUE TUNER.vst3.zip » (le .vst3 et le .component), le fichier à envoyer dans ONIRIQUE CENTRAL comme version Mac.
name: Plugin Mac

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compiler
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          cmake --build build --config Release --target OniriqueTuner_VST3 OniriqueTuner_AU --parallel

      # Sans compte Apple Developer, les plugins portent une signature locale (« ad hoc ») : le minimum pour qu'un DAW
      # les charge sur un Mac Apple Silicon.
      - name: Signer localement et zipper
        run: |
          mkdir sortie
          for NAME in "ONIRIQUE TUNER.vst3" "ONIRIQUE TUNER.component"; do
            PLUGIN="$(find build -type d -name "$NAME" | head -n 1)"
            test -n "$PLUGIN"
            lipo -info "$PLUGIN/Contents/MacOS/ONIRIQUE TUNER"
            codesign --force --deep --sign - "$PLUGIN"
            codesign --verify --deep --strict "$PLUGIN"
            cp -R "$PLUGIN" sortie/
          done
          (cd sortie && ditto -c -k . "../ONIRIQUE TUNER.vst3.zip")
          unzip -l "ONIRIQUE TUNER.vst3.zip" | tail -n 3

      # Le contrôle d'Apple, celui que Logic Pro fait passer à chaque Audio Unit. Un échec ici n'empêche pas de
      # récupérer le fichier, mais il annonce un plugin que Logic refusera.
      - name: Valider l'Audio Unit (auval)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "sortie/ONIRIQUE TUNER.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Otn1 Onrq

      - uses: actions/upload-artifact@v4
        with:
          name: ONIRIQUE-TUNER-mac
          path: ONIRIQUE TUNER.vst3.zip
          if-no-files-found: error

      # Dépose le fichier sur le serveur ONIRIQUE, dans /srv/livraison (voir deploy/install-livraison.sh du dépôt
      # ONIRIQUE CENTRAL). Rien n'est mis en ligne ici. Sans le secret LIVRAISON_KEY, l'étape est passée.
      - name: Livrer sur le serveur
        env:
          LIVRAISON_KEY: ${{ secrets.LIVRAISON_KEY }}
        run: |
          if [ -z "$LIVRAISON_KEY" ]; then echo "Secret LIVRAISON_KEY absent : fichier à télécharger depuis Artifacts."; exit 0; fi
          mkdir -p ~/.ssh
          # Un copier-coller depuis un terminal Windows abîme souvent la clé (retours chariot, espaces) : elle est remise en forme.
          CORPS=$(printf '%s' "$LIVRAISON_KEY" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$CORPS" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/livraison
          chmod 600 ~/.ssh/livraison
          if ! ssh-keygen -y -f ~/.ssh/livraison > ~/.ssh/livraison.pub; then
            echo "Le secret LIVRAISON_KEY n'est pas une clé complète : recollez-la en entier, de -----BEGIN à -----END compris."
            exit 1
          fi
          # L'empreinte (publique) doit être celle qu'affiche le serveur : ssh-keygen -lf /home/livraison/.ssh/authorized_keys
          echo "Empreinte de la clé utilisée : $(ssh-keygen -lf ~/.ssh/livraison.pub)"
          echo "217.160.106.244 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICV3xBScmxJy34Jgjtvb0R4UCG3jmzkSU+/T1lDrvD/l" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/livraison -o IdentitiesOnly=yes -o BatchMode=yes livraison@217.160.106.244 tuner-mac < "ONIRIQUE TUNER.vst3.zip"
